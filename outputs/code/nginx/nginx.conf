user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent upstream=$upstream_addr '
                      'upstream_status=$upstream_status '
                      'request_time=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Both backend containers are upstream servers.  They are addressed by
    # their Docker Compose service names, so Docker's embedded DNS resolves
    # them to the container IPs on the shared network.
    # Default policy: round robin.
    # ------------------------------------------------------------------
    upstream backend_pool {
        server backend1:8000;
        server backend2:8000;
    }

    server {
        listen 6120;
        server_name _;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Short timeouts keep the fault-tolerance test fast: a stopped
            # backend is detected quickly and the request is retried on the
            # remaining healthy upstream server.
            proxy_connect_timeout 1s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;

            # Retry the next upstream server if this one refuses the
            # connection (e.g. its container was stopped).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
