# Variant of nginx.conf used ONLY for the "1 backend" half of the performance
# experiment: the upstream pool contains a single server, so every request is
# handled by backend1 and no request is retried onto a second instance.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent upstream=$upstream_addr '
                      'upstream_status=$upstream_status '
                      'request_time=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend_pool {
        server backend1:8000;
    }

    server {
        listen 6120;
        server_name _;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}
