# CISC 7403 Project II - "1 backend" configuration, used ONLY for the second
# half of the performance experiment (comparison against the 2-backend setup).
#
#   docker compose -f docker-compose.yml down          # stop the 2-backend stack first
#   docker compose -f docker-compose.single.yml up -d --build
#
# It is identical to docker-compose.yml except that backend2 is removed and the
# load balancer mounts nginx/nginx.single.conf, whose upstream pool contains a
# single server.  Removing backend2 from the pool (instead of leaving a dead
# upstream in it) guarantees that no request is retried onto a second instance.

name: cisc7403-lb

x-backend: &backend
  image: cisc7403/backend:1.0
  build:
    context: ./backend
  expose:
    - "8000"
  networks:
    - appnet

services:
  backend1:
    <<: *backend
    container_name: backend1
    hostname: backend1
    environment:
      INSTANCE_NAME: backend1
      WORK_DELAY_SECONDS: "0.05"

  lb:
    image: nginx:1.27-alpine
    container_name: lb
    ports:
      - "6120:6120"
    volumes:
      - ./nginx/nginx.single.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
